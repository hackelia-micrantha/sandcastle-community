name: Public documentation validation

on:
  pull_request:
  push:
    branches:
      - main

# Public, untrusted PRs must not run on privileged private or self-hosted runners.
permissions:
  contents: read

jobs:
  validate-public-docs:
    name: Validate public documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run deterministic link-validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate repository-local Markdown targets
        run: python3 scripts/check_public_docs_links.py
